<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Усі послуги | Royal Garage</title><link rel="stylesheet" href="css/styles.css"><style>body{background:#061a35;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px 16px 60px}h1{color:#f0d18a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.item{background:#102b4f;border:1px solid #8e743c;border-radius:14px;padding:16px;overflow-wrap:anywhere}.item img{width:100%;border-radius:8px;margin-top:10px}a{color:#f0d18a}</style></head><body><main class="wrap"><a id="back" href="businesses.html">← До бізнес-профілю</a><h1>Усі послуги</h1><p id="status">Завантаження…</p><div id="grid" class="grid"></div></main><script>(()=>{'use strict';const id=new URLSearchParams(location.search).get('id');const root=document.getElementById('grid');const status=document.getElementById('status');if(!id){status.textContent='Не вказано компанію.';return}document.getElementById('back').href='business-profile.html?id='+encodeURIComponent(id);fetch('/api/business/profiles/'+encodeURIComponent(id)).then(async r=>{if(!r.ok)throw Error('Не вдалося завантажити профіль');return r.json()}).then(data=>{const p=data.profile;if(!p)throw Error('Профіль не знайдено');const list = (Array.isArray(p.services) ? p.services : []); for(const item of list){ const card=document.createElement('article');card.className='item'; const title=document.createElement('h3');title.textContent=item.title||'Послуга';card.append(title);if(item.description){const d=document.createElement('p');d.textContent=item.description;card.append(d)}if(Number(item.priceFrom)>0){const pr=document.createElement('strong');pr.textContent='від '+Number(item.priceFrom).toLocaleString('uk-UA')+' грн';card.append(pr)} for(const url of (Array.isArray(item.photos)?item.photos:[]).slice(0,6)){const img=document.createElement('img');img.src=url;img.loading='lazy';img.alt=item.title||'Послуга';card.append(img)}root.append(card)}status.textContent=list.length?'':'Поки немає записів.'}).catch(e=>status.textContent=e.message)})();</script></body></html>
