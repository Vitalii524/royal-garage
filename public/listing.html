<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Оголошення | Royal Garage</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link
        rel="stylesheet"
        href="css/styles.css"
    >
    <link
    rel="stylesheet"
    href="css/listing.css"
>

</head>

<body>
    <header class="site-header">

        <div class="top-line">
    
            <div class="brand">
                <a href="index.html">
                    <img
                        src="images/royal-garage-logo.png"
                        alt="Royal Garage"
                    >
                </a>
            </div>
    
            <nav class="nav">
                <a href="index.html">Головна</a>
                <a href="forum.html">Форум</a>
                <a href="market.html">Авторинок</a>
                <a href="profile.html">Мій профіль</a>
            </nav>
    
            <div
                id="authArea"
                class="auth-area"
            ></div>
    
        </div>
    
    </header>

    <main class="listing-page">
        <a
            href="market.html"
            class="listing-back-link"
        >
            ← Назад до авторинку
        </a>

        <section
            id="listingDetails"
            class="listing-details"
        >
            <p id="listingLoading">
                Завантаження оголошення...
            </p>
        </section>
    </main>

    <footer>
        Royal Garage © 2026
    </footer>

    <!-- ===== ПОВНОЕКРАННИЙ ПЕРЕГЛЯД ФОТО ===== -->

    <div
    id="photoViewer"
    class="photo-viewer"
    aria-hidden="true"
>
    <button
        type="button"
        id="closePhotoViewer"
        class="photo-viewer-close"
        aria-label="Закрити фото"
    >
        ×
    </button>

    <button
        type="button"
        id="previousViewerPhoto"
        class="photo-viewer-arrow photo-viewer-arrow-left"
        aria-label="Попереднє фото"
    >
        ‹
    </button>

    <img
        id="photoViewerImage"
        class="photo-viewer-image"
        src=""
        alt=""
    >

    <button
        type="button"
        id="nextViewerPhoto"
        class="photo-viewer-arrow photo-viewer-arrow-right"
        aria-label="Наступне фото"
    >
        ›
    </button>
</div>
    <script src="js/auth.js"></script>
    <script src="js/listing.js"></script>
</body>
</html>
