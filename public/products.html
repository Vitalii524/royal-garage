<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Автотовари | Royal Garage</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/service-gallery.css">
    <link rel="stylesheet" href="css/product-catalog.css?v=20261122-layout">
    <script src="/js/site-header.js?v=account-menu" defer></script>
</head>
<body>
<header data-site-navigation><div id="authArea"></div></header>
<main class="catalog-wrap">
    <section class="catalog-panel" aria-labelledby="catalogTitle">
        <h1 id="catalogTitle">Каталог автотоварів</h1>
        <form id="catalogSearchForm" class="catalog-form" role="search">
            <label>Пошук товару
                <input id="catalogSearch" placeholder="Назва або опис…" maxlength="120">
            </label>
            <label>Категорія
                <input id="catalogCategory" placeholder="Наприклад, Автохімія" maxlength="120">
            </label>
            <button class="rg-service-more" type="submit">Знайти</button>
        </form>
        <p id="catalogStatus" role="status"></p>
    </section>
    <div id="catalogGrid" class="catalog-grid"></div>
    <button id="catalogMore" class="rg-service-more" type="button" hidden>Показати ще</button>
</main>
<script src="js/auth.js?v=account-menu"></script>
<script src="js/service-gallery.js"></script>
<script src="js/product-catalog.js?v=20261122-order"></script>
<script src="/js/notifications.js?v=shared-header" defer></script>
<script src="/js/lang.js" defer></script></body>
</html>
