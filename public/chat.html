<body class="chat-page">
<header class="site-header">

<main class="chat-page">
<div class="chat-top-bar">
<a class="chat-back-link" data-i18n="auto.395" href="market.html" id="chatBackLink">
                ← Назад
            </a>
<strong data-i18n="auto.396">Чат із продавцем</strong>
</div>
<section class="chat-card">
<h1 data-i18n="auto.396" id="chatTitle">
                Чат із продавцем
            </h1>
<div class="chat-messages" id="chatMessages">
<p data-i18n="auto.397">Завантаження повідомлень...</p>
</div>
<form class="chat-form" id="chatForm">

                        📎
                    </label>
<input accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" hidden="" id="chatAttachmentInput" type="file"/>
<textarea data-i18n-placeholder="auto.401" id="chatMessageInput" placeholder="Напишіть повідомлення..." rows="1"></textarea>
<button data-i18n="auto.398" id="chatSubmitButton" type="submit">
                        Надіслати
                    </button>
</div>
<p class="chat-file-error" hidden="" id="chatFileError"></p>
</form>
</section>
</main>
<div class="chat-image-viewer" hidden="" id="chatImageViewer">
