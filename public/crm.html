<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CRM RG | Royal Garage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .crm-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .crm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .crm-title {
            margin: 0;
            font-size: 32px;
        }

        .crm-subtitle {
            margin-top: 6px;
            color: #aaa;
        }

        .crm-back {
            color: #fff;
            text-decoration: none;
        }

        .crm-status {
            padding: 16px;
            border: 1px solid #333;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .crm-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .crm-card {
            padding: 20px;
            border: 1px solid #333;
            border-radius: 14px;
            background: #1a1a1a;
        }

        .crm-card h2 {
            margin-top: 0;
        }

        .crm-card p {
            margin-bottom: 0;
            color: #aaa;
        }

        .crm-error {
            color: #ff8a8a;
        }
    </style>
</head>

<body>

    <main class="crm-page">

        <header class="crm-header">
            <div>
                <h1 class="crm-title">
                    CRM RG
                </h1>

                <div
                    id="crmBusinessName"
                    class="crm-subtitle"
                >
                    Завантаження...
                </div>
            </div>

            <a
                href="business-profile.html"
                class="crm-back"
            >
                ← Мій бізнес
            </a>
        </header>

        <section
            id="crmStatus"
            class="crm-status"
        >
            Перевіряємо доступ до CRM...
        </section>

        <section class="crm-status">
            <button
                id="crmAddClientButton"
                type="button"
            >
                + Додати клієнта
            </button>
        
            <form
                id="crmClientForm"
                hidden
                style="margin-top: 16px;"
            >
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmClientName"
                        type="text"
                        placeholder="Ім'я клієнта"
                        required
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmClientPhone"
                        type="text"
                        placeholder="Телефон"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmClientEmail"
                        type="email"
                        placeholder="Email"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <textarea
                        id="crmClientNotes"
                        placeholder="Примітки"
                    ></textarea>
                </div>
        
                <button type="submit">
                    Зберегти клієнта
                </button>
            </form>
        </section>

        <section class="crm-status">
            <button
                id="crmAddCarButton"
                type="button"
            >
                + Додати автомобіль
            </button>
        
            <form
                id="crmCarForm"
                hidden
                style="margin-top: 16px;"
            >
                <div style="margin-bottom: 12px;">
                    <select
                        id="crmCarClient"
                        required
                    >
                        <option value="">
                            Виберіть клієнта
                        </option>
                    </select>
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmCarBrand"
                        type="text"
                        placeholder="Марка"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmCarModel"
                        type="text"
                        placeholder="Модель"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmCarYear"
                        type="number"
                        placeholder="Рік"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmCarVin"
                        type="text"
                        placeholder="VIN"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmCarPlate"
                        type="text"
                        placeholder="Держ. номер"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmCarMileage"
                        type="number"
                        placeholder="Пробіг, км"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmCarEngine"
                        type="text"
                        placeholder="Двигун"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmCarFuel"
                        type="text"
                        placeholder="Паливо"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <input
                        id="crmCarTransmission"
                        type="text"
                        placeholder="Коробка передач"
                    >
                </div>
        
                <div style="margin-bottom: 12px;">
                    <textarea
                        id="crmCarNotes"
                        placeholder="Примітки"
                    ></textarea>
                </div>
        
                <button type="submit">
                    Зберегти автомобіль
                </button>
            </form>
        </section>

        <section
            id="crmDashboard"
            class="crm-grid"
            hidden
        >
        <div class="crm-card">
            <h2>Клієнти</h2>
        
            <p id="crmClientsCount">
                Завантаження...
            </p>
        
            <div id="crmClientsList"></div>
        </div>

            <div class="crm-card">
                <h2>Автомобілі</h2>
                <p>
                    Автомобілі клієнтів.
                </p>
            </div>

            <div class="crm-card">
                <h2>Замовлення-наряди</h2>
                <p>
                    Роботи, запчастини та статуси.
                </p>
            </div>

            <div class="crm-card">
                <h2>Календар</h2>
                <p>
                    Записи та планування робіт.
                </p>
            </div>

            <div class="crm-card">
                <h2>Працівники</h2>
                <p>
                    Менеджери та механіки.
                </p>
            </div>

            <div class="crm-card">
                <h2>Налаштування</h2>
                <p>
                    Налаштування CRM RG.
                </p>
            </div>
        </section>

    </main>

    <script src="js/crm.js"></script>
</body>
</html>
