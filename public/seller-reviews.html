<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Відгуки про продавця | Royal Garage</title><link rel="icon" href="images/favicon.png"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/business-profile.css"><style>
    .reviews-page{max-width:820px;margin:auto;padding:25px 16px 80px;min-height:70vh;color:#f7f8fb}.reviews-page h1,.reviews-page h2{color:#f0d18a}.review-card,.review-form{padding:20px;margin:14px 0;border:1px solid rgba(214,160,58,.35);border-radius:16px;background:rgba(12,36,72,.9)}.review-card p{white-space:pre-wrap;overflow-wrap:anywhere}.review-card small,.muted{color:#b2bfd0}.review-form label{display:block;margin:12px 0 6px}.review-form textarea,.review-form select{box-sizing:border-box;width:100%;padding:12px;background:#061a35;color:white;border:1px solid #c8a55e;border-radius:8px}.review-form button{margin-top:14px;padding:12px 18px;background:#153d68;color:#f0d18a;border:1px solid #c8a55e;border-radius:8px;cursor:pointer}.review-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    </style></head><body><header class="site-header"><div class="top-line"><div class="brand"><a href="index.html"><img src="images/royal-garage-logo.png" alt="Royal Garage"></a></div></div></header><main class="reviews-page"><a id="backLink" href="market.html" class="business-back-link">← Назад</a><h1>Відгуки про продавця</h1><p id="status" class="muted">Завантаження…</p><div id="reviews"></div><section id="writeSection" class="review-form" hidden><h2>Ваш відгук</h2><label for="rating">Оцінка</label><select id="rating"><option value="">Оберіть оцінку</option><option value="5">★★★★★ — 5</option><option value="4">★★★★ — 4</option><option value="3">★★★ — 3</option><option value="2">★★ — 2</option><option value="1">★ — 1</option></select><label for="review">Текст відгуку</label><textarea id="review" rows="5" maxlength="1000" placeholder="Розкажіть про досвід спілкування з продавцем"></textarea><button id="save" type="button">Зберегти відгук</button><p id="saveStatus" aria-live="polite"></p></section><p id="loginHint" class="muted" hidden>Щоб залишити відгук, увійдіть у свій акаунт.</p></main><script>
    (()=>{'use strict';const p=new URLSearchParams(location.search),ownerId=p.get('ownerId');const $=id=>document.getElementById(id);const token=localStorage.getItem('royalGarageToken');let user=null;try{user=JSON.parse(localStorage.getItem('royalGarageCurrentUser')||'null')}catch{}const userId=user?.id||user?.userId||user?.user_id;const back=p.get('back');if(back&&/^(listing|business-profile|service-hub)\.html(?:\?[^#]*)?$/.test(back))$('backLink').href=back;
    if(!ownerId){$('status').textContent='Не вказано продавця.';return}const endpoint='/api/sellers/'+encodeURIComponent(ownerId);
    async function load(){try{const r=await fetch(endpoint+'/reviews');if(!r.ok)throw Error('Не вдалося завантажити відгуки.');const data=await r.json();const reviews=Array.isArray(data.reviews)?data.reviews:[];$('reviews').replaceChildren();$('status').textContent=reviews.length?'Відгуків: '+reviews.length:'Відгуків поки немає.';for(const rev of reviews){if(!String(rev.text||'').trim())continue;const card=document.createElement('article');card.className='review-card';const top=document.createElement('div');top.className='review-top';const name=document.createElement('strong');name.textContent=rev.userName||'Користувач';const stars=document.createElement('span');stars.textContent='★'.repeat(Math.max(0,Math.min(5,Number(rev.rating)||0)));top.append(name,stars);const body=document.createElement('p');body.textContent=rev.text||'';const date=document.createElement('small');const d=new Date(rev.updatedAt||rev.createdAt);date.textContent=Number.isNaN(d.getTime())?'':d.toLocaleDateString('uk-UA');card.append(top,body,date);$('reviews').append(card)}const mine=reviews.find(x=>String(x.userId)===String(userId));if(mine){$('rating').value=String(mine.rating||'');$('review').value=mine.text||'';$('save').textContent='Оновити відгук'}}catch(e){$('status').textContent=e.message}}
    if(token&&userId&&String(userId)!==String(ownerId))$('writeSection').hidden=false;else if(!token)$('loginHint').hidden=false;
    $('save').addEventListener('click',async()=>{const rating=Number($('rating').value),review=$('review').value.trim();if(!Number.isInteger(rating)||rating<1||rating>5){$('saveStatus').textContent='Оберіть оцінку від 1 до 5.';return}if(review&&review.length<5){$('saveStatus').textContent='Мінімум 5 символів у відгуку.';return}try{const r=await fetch(endpoint+'/rating',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({rating,review})});const data=await r.json();if(!r.ok)throw Error(data.message||'Помилка збереження.');$('saveStatus').textContent='Відгук збережено.';await load()}catch(e){$('saveStatus').textContent=e.message}});load()})();
    </script></body></html>
