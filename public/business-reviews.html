<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Відгуки бізнесу | Royal Garage</title><link rel="icon" href="images/favicon.png"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/business-profile.css"><style>
.business-reviews-page {max-width:820px;margin:0 auto;padding:24px 16px 80px;min-height:75vh;color:#f7f8fb}
.business-reviews-page h1{color:#f0d18a;margin:0 0 24px}
.business-review-card {padding:20px;margin:14px 0;border:1px solid rgba(214,160,58,.28);border-radius:18px;background:rgba(12,36,72,.9);overflow-wrap:anywhere}
.business-review-top {display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.business-review-card p {white-space:pre-wrap;line-height:1.6}
.business-review-card small,.business-review-muted{color:#b2bfd0}
</style></head><body><header class="site-header"><div class="top-line"><div class="brand"><a href="index.html"><img src="images/royal-garage-logo.png" alt="Royal Garage"></a></div></div></header>
<main class="business-reviews-page"><a id="backLink" class="business-back-link" href="businesses.html">← Назад до бізнес-профілю</a><section class="business-section"><h1>Відгуки</h1><p id="reviewsStatus" class="business-review-muted">Завантаження відгуків…</p><div id="reviewsList"></div></section></main>
<script>
(()=>{'use strict';const p=new URLSearchParams(location.search),id=p.get('ownerId'),back=p.get('back');
const link=document.getElementById('backLink');if(back&&/^(business-profile|service-hub)\.html(?:\?[^#]*)?$/.test(back))link.href=back;
const status=document.getElementById('reviewsStatus'),root=document.getElementById('reviewsList');
const fmt=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric'})};
if(!id){status.textContent='Не вказано бізнес для перегляду відгуків.';return;}
fetch(`/api/sellers/${encodeURIComponent(id)}/reviews`).then(async r=>{if(!r.ok)throw Error('Не вдалося завантажити відгуки.');return r.json()}).then(data=>{
const reviews=Array.isArray(data.reviews)?data.reviews:[];status.textContent=reviews.length?`Відгуків: ${reviews.length}`:'Відгуків ще немає.';
for(const rev of reviews){const card=document.createElement('article');card.className='business-review-card';
const top=document.createElement('div');top.className='business-review-top';const name=document.createElement('strong');name.textContent=rev.userName||'Користувач';const stars=document.createElement('span');stars.textContent='⭐'.repeat(Math.max(0,Math.min(5,Number(rev.rating)||0)));top.append(name,stars);
const body=document.createElement('p');body.textContent=rev.text||'';const date=document.createElement('small');date.textContent=fmt(rev.updatedAt||rev.createdAt);card.append(top,body,date);root.append(card);}
}).catch(e=>{status.textContent=e.message;});})();
</script></body></html>
