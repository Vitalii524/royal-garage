<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Сповіщення — Royal Garage</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/notifications.css?v=1"><script src="/js/site-header.js?v=account-menu" defer></script>
</head>
<body>
<header data-site-navigation><div id="authArea"></div></header>
<main id="notificationCenter" class="rg-notification-main"><h1>Сповіщення</h1><p>Форум, авторинок, Service Hub, клуби та профілі — в одному місці.</p>
<div class="rg-notification-tools"><label for="notificationSource">Розділ</label><select id="notificationSource"><option value="">Усі сповіщення</option value="forum">Форум</option><option value="market">Авторинок</option><option value="service">Service Hub</option><option value="clubs">Клуби</option><option value="profile">Профілі</option></select><button id="notificationRefresh" type="button">Оновити</button><button id="notificationReadAll" type="button">Прочитати всі</button></div>
<p role="status" aria-live="polite"></p><div id="notificationList"></div><button id="notificationMore" hidden type="button">Показати ще</button>
<section class="rg-push-settings"><h2>Сповіщення на пристрої</h2><p id="notificationPushStatus"></p><p>Дозвіл запитується лише після натискання кнопки. У Push показується тип події, без тексту приватного листування.</p><div class="rg-notification-tools"><button id="notificationPushOn" type="button">Увімкнути Push</button><button id="notificationPushOff" type="button">Вимкнути на цьому пристрої</button></div></section>
<a href="/profile.html">Мій профіль</a></main><script src="/js/auth.js?v=account-menu"></script><script src="/js/notifications.js?v=shared-header"></script><script src="/js/lang.js" defer></script></body></html>
