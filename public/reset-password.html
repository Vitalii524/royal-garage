<!DOCTYPE html>

<html lang="uk">
<head>
<script src="/js/analytics.js"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title data-i18n="auto.332">
        Новий пароль | Royal Garage
    </title>
<link href="css/styles.css" rel="stylesheet"/>
<script src="/js/site-header.js?v=shared-header" defer></script>
</head>
<body>
<header data-site-navigation></header>
<main class="reset-password-page">
<section class="reset-password-card"><div class="language-switcher"><button class="active" data-lang="uk" type="button">UA</button><button data-lang="en" type="button">EN</button></div>
<h1 data-i18n="auto.333">
                Новий пароль
            </h1>
<p data-i18n="auto.334">
                Введіть новий пароль
                для вашого акаунта.
            </p>
<form id="resetPasswordForm">
<label data-i18n-label="auto.333">
                    Новий пароль

                    <input autocomplete="new-password" id="newPassword" minlength="6" required="" type="password"/>
</label>
<label data-i18n-label="auto.335">
                    Повторіть пароль

                    <input autocomplete="new-password" id="confirmPassword" minlength="6" required="" type="password"/>
</label>
<button class="gold-btn" data-i18n="auto.336" type="submit">
                    Змінити пароль
                </button>
</form>
<p id="resetPasswordMessage"></p>
</section>
</main>
<script src="js/reset-password.js"></script>
<script src="js/loader.js"></script>
<script src="js/lang.js"></script><script src="/js/auth.js?v=shared-header" defer></script>
<script src="/js/notifications.js?v=shared-header" defer></script>
</body>
</html>
