<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Новий пароль | Royal Garage
    </title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>

    <main class="reset-password-page">

        <section class="reset-password-card">

            <h1>
                Новий пароль
            </h1>

            <p>
                Введіть новий пароль
                для вашого акаунта.
            </p>


            <form id="resetPasswordForm">

                <label>
                    Новий пароль

                    <input
                        type="password"
                        id="newPassword"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </label>


                <label>
                    Повторіть пароль

                    <input
                        type="password"
                        id="confirmPassword"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                </label>


                <button
                    type="submit"
                    class="gold-btn"
                >
                    Змінити пароль
                </button>

            </form>


            <p
                id="resetPasswordMessage"
            ></p>

        </section>

    </main>


    <script
        src="js/reset-password.js"
    ></script>
    <script src="js/loader.js"></script>

</body>

</html>
